<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stylus test</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 8px 12px; border-bottom: 1px solid #ccc; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  header b { font-size: 16px; }
  button { font: inherit; padding: 6px 10px; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; min-height: 0; }
  #pad { grid-row: 1 / 3; touch-action: none; background: #fafafa; border-right: 1px solid #ccc; width: 100%; height: 100%; display: block; }
  #live, #log { overflow: auto; padding: 8px 12px; font: 12px/1.35 ui-monospace, Menlo, monospace; white-space: pre; }
  #live { border-bottom: 1px solid #ccc; }
  .hit { color: #0a7; font-weight: bold; }
  .miss { color: #999; }
  .warn { color: #c50; }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; grid-template-rows: 45% 1fr 1fr; }
    #pad { grid-row: auto; border-right: 0; border-bottom: 1px solid #ccc; }
  }
</style>
</head>
<body>
<header>
  <b>Stylus test</b>
  <span>Draw in the grey area with the pen, then try the eraser end and the barrel button, with the pen touching and hovering.</span>
  <button id="clear">Clear</button>
  <button id="copy">Copy report</button>
  <span id="copied"></span>
</header>
<main>
  <canvas id="pad"></canvas>
  <div id="live"></div>
  <div id="log"></div>
</main>
<script>
(() => {
  const pad = document.getElementById("pad");
  const live = document.getElementById("live");
  const log = document.getElementById("log");
  const ctx = pad.getContext("2d");
  const lines = [];
  const seen = new Map();      // "pointerType buttons" -> count
  const types = new Set();
  let last = null, lastButtons = -1, lastType = "", lastPressure = -1, lastHover = null;
  let coalescedMax = 0, predictedMax = 0, rawUpdates = 0;
  const t0 = performance.now();

  function resize() {
    const r = pad.getBoundingClientRect();
    const d = devicePixelRatio || 1;
    pad.width = Math.round(r.width * d); pad.height = Math.round(r.height * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
  }
  addEventListener("resize", resize); resize();

  const FIELDS = ["type","pointerType","pointerId","isPrimary","button","buttons","pressure",
    "tangentialPressure","tiltX","tiltY","twist","altitudeAngle","azimuthAngle","width","height","persistentDeviceId"];

  function fmt(v) { return typeof v === "number" && !Number.isInteger(v) ? v.toFixed(3) : String(v); }

  function addLine(s, cls) {
    const t = ((performance.now() - t0) / 1000).toFixed(2).padStart(7);
    lines.push(`${t}  ${s}`);
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = `${t}  ${s}`;
    log.appendChild(div);
    if (log.children.length > 400) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  function support() {
    const P = window.PointerEvent && PointerEvent.prototype;
    const out = [
      ["PointerEvent", !!window.PointerEvent],
      ["getCoalescedEvents", !!(P && P.getCoalescedEvents)],
      ["getPredictedEvents", !!(P && P.getPredictedEvents)],
      ["altitudeAngle/azimuthAngle", !!(P && "altitudeAngle" in P)],
      ["persistentDeviceId", !!(P && "persistentDeviceId" in P)],
      ["pointerrawupdate", "onpointerrawupdate" in window],
      ["navigator.ink (delegated ink)", !!(navigator.ink)],
      ["maxTouchPoints", navigator.maxTouchPoints],
      ["hover: hover", matchMedia("(hover: hover)").matches],
      ["pointer: fine", matchMedia("(pointer: fine)").matches],
      ["any-pointer: fine", matchMedia("(any-pointer: fine)").matches],
    ];
    return out.map(([k, v]) => `${k}: ${v}`).join("\n") + `\nUA: ${navigator.userAgent}\n` +
      (navigator.userAgentData ? `platform: ${navigator.userAgentData.platform} mobile: ${navigator.userAgentData.mobile}\n` : "");
  }
  const supportText = support();

  function render() {
    let s = "== support ==\n" + supportText + "\n== last event ==\n";
    if (last) {
      s += FIELDS.map(f => `${f}: ${fmt(last[f])}`).join("\n") + "\n";
      const b = last.buttons;
      s += `\nbuttons bits: ${b.toString(2).padStart(6, "0")}  ` +
        `[contact ${b & 1 ? "Y" : "-"}] [barrel ${b & 2 ? "Y" : "-"}] [eraser ${b & 32 ? "Y" : "-"}]\n`;
      const dec = [];
      if (last.pointerType === "pen" && (b & 32)) dec.push("ERASER BUTTON (buttons & 32) → pdfink would erase");
      if (last.pointerType === "pen" && (b & 2)) dec.push("BARREL BUTTON (buttons & 2) → pdfink would erase");
      if (last.pointerType === "pen" && b === 1) dec.push("pen tip → pdfink would draw");
      if (last.pointerType === "pen" && b === 0) dec.push("pen hovering");
      s += dec.length ? dec.join("\n") + "\n" : "";
    } else {
      s += "(none yet)\n";
    }
    s += "\n== combinations seen (pointerType buttons → events) ==\n";
    for (const [k, v] of seen) s += `${k} → ${v}\n`;
    s += `\ncoalesced per move, max: ${coalescedMax}   predicted max: ${predictedMax}   rawupdate events: ${rawUpdates}\n`;
    s += `pointer types seen: ${[...types].join(", ") || "none"}\n`;
    live.textContent = s;
  }

  function note(e) {
    last = e;
    types.add(e.pointerType);
    const k = `${e.pointerType} buttons=${e.buttons}`;
    seen.set(k, (seen.get(k) || 0) + 1);
    if (e.getCoalescedEvents) coalescedMax = Math.max(coalescedMax, e.getCoalescedEvents().length);
    if (e.getPredictedEvents) predictedMax = Math.max(predictedMax, e.getPredictedEvents().length);
    // Log transitions, not every move.
    if (e.type !== "pointermove") {
      addLine(`${e.type} ${e.pointerType} id=${e.pointerId} button=${e.button} buttons=${e.buttons} p=${fmt(e.pressure)} tilt=${e.tiltX},${e.tiltY}`,
        e.buttons & 32 ? "hit" : e.buttons & 2 ? "hit" : "");
    } else if (e.buttons !== lastButtons || e.pointerType !== lastType) {
      addLine(`move: ${e.pointerType} buttons ${lastButtons} → ${e.buttons} (p=${fmt(e.pressure)})`, e.buttons & 34 ? "hit" : "");
    }
    lastButtons = e.buttons; lastType = e.pointerType;
    render();
  }

  // Drawing so you can see which events draw. Colour by what the pen reports.
  let prev = null;
  function colour(e) {
    if (e.pointerType !== "pen") return e.pointerType === "touch" ? "#09f" : "#555";
    if (e.buttons & 32) return "#e33";
    if (e.buttons & 2) return "#e90";
    return "#000";
  }
  pad.addEventListener("pointerdown", (e) => {
    try { pad.setPointerCapture(e.pointerId); } catch {}
    note(e); prev = { x: e.offsetX, y: e.offsetY };
  });
  pad.addEventListener("pointermove", (e) => {
    note(e);
    if (e.buttons && prev) {
      ctx.strokeStyle = colour(e);
      ctx.lineWidth = 1 + 6 * (e.pointerType === "pen" ? e.pressure : 0.5);
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
      prev = { x: e.offsetX, y: e.offsetY };
    } else if (e.buttons) {
      prev = { x: e.offsetX, y: e.offsetY };
    } else {
      prev = null;
    }
    // Barrel button while hovering shows buttons=2 with pressure 0 on some pens;
    // draw a dot so hover-with-button is visible.
    if (e.pointerType === "pen" && !(e.buttons & 1) && e.buttons) {
      ctx.fillStyle = colour(e); ctx.beginPath(); ctx.arc(e.offsetX, e.offsetY, 2, 0, 7); ctx.fill();
    }
  });
  for (const t of ["pointerup", "pointercancel", "pointerenter", "pointerleave", "pointerover", "pointerout", "gotpointercapture", "lostpointercapture"]) {
    pad.addEventListener(t, (e) => { note(e); if (t === "pointerup" || t === "pointercancel") prev = null; });
  }
  if ("onpointerrawupdate" in window) pad.addEventListener("pointerrawupdate", () => { rawUpdates++; });
  // The barrel button usually fires contextmenu; swallow it so it doesn't steal the gesture.
  pad.addEventListener("contextmenu", (e) => { e.preventDefault(); addLine("contextmenu (suppressed)", "warn"); });
  // Mouse fallbacks, to see if the browser is synthesising mouse events for the pen.
  for (const t of ["mousedown", "mouseup", "auxclick"]) {
    pad.addEventListener(t, (e) => addLine(`${t} button=${e.button} buttons=${e.buttons}`, "miss"));
  }
  pad.addEventListener("touchstart", () => addLine("touchstart (touch events also fire)", "miss"), { passive: true });

  document.getElementById("clear").onclick = () => { ctx.clearRect(0, 0, pad.width, pad.height); log.textContent = ""; lines.length = 0; seen.clear(); types.clear(); last = null; render(); };
  document.getElementById("copy").onclick = async () => {
    const report = live.textContent + "\n== log ==\n" + lines.join("\n");
    try { await navigator.clipboard.writeText(report); document.getElementById("copied").textContent = "copied"; }
    catch { document.getElementById("copied").textContent = "clipboard blocked; select the text instead"; }
    setTimeout(() => document.getElementById("copied").textContent = "", 2000);
  };
  render();
})();
</script>
</body>
</html>
