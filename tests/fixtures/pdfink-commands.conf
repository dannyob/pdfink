# Commands for the end-to-end tests. The API test server runs with
# PDFINK_COMMANDS pointing here, so cwd is tests/fixtures.
[Where am I]
command = printf '%s %s %s %s' "$NAME" "$PAGE" "$X" "$Y" > "$NOTEBOOKS/where.txt"

[Snapshot the file]
command = cp "$PDF" "$NOTEBOOKS/snapshot.pdf"

[Touch the file]
# Long enough for a test to add a page while it runs.
command = sleep 1; touch "$PDF"

[Replace with two pages]
command = cp "$NOTEBOOKS/two-pages.pdf" "$PDF"
reload = true

[Describe selection]
command = node bridge-tool.cjs selection

[Ask my name]
command = node bridge-tool.cjs ask

[Draw via bridge]
command = node bridge-tool.cjs draw

[Buttons]
command = node bridge-tool.cjs buttons
detach = true

[Finish and reload]
command = node bridge-tool.cjs buttons
detach = true
reload = true

[Star via bridge]
command = uv run --script ../../tools/star.py "$PDF" "$PAGE" "$X" "$Y"
